<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>内容运营 · DSH 工作台</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23292929'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='18' fill='white'%3E媒%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="./app.css"><link rel="stylesheet" href="./dock.css"><link rel="stylesheet" href="./analytics.css"><link rel="stylesheet" href="./daily-chart.css"></head><body>
<!-- Operate surface: preserve DSH's quiet white utility layout. Six navigable work areas share one persistent data set; focused edits use an accessible side drawer. No illustrative metrics. -->
<header><div class="brand"><span class="brand-mark">媒</span><div><strong>内容运营</strong><span class="subtitle">选题、合作与成果，在这里连接</span></div></div><div class="header-actions"><button id="sessions">会话记录</button><button id="new-session">新建工作台会话</button><a class="button" href="/api/media-workbench/export" download="media-workbench.json">导出数据</a></div></header>
<nav aria-label="工作面板" id="nav"></nav><div id="notice" role="status" aria-live="polite" hidden></div><main><div class="workspace-controls"><div id="toolbar"></div><div class="page-heading"><div><h1 id="title">选题面板</h1><p id="description"></p></div><div id="actions"></div></div></div><section id="content" aria-live="polite"><p>正在读取工作台数据…</p></section></main>
<dialog id="drawer" aria-labelledby="drawer-title"><form id="editor"><div class="drawer-heading"><h2 id="drawer-title"></h2><button type="button" id="close" aria-label="关闭面板">关闭</button></div><div id="fields"></div><p class="form-error" id="form-error" role="alert"></p><div class="drawer-footer"><button type="button" id="cancel">取消</button><button type="submit" class="primary" id="save">保存</button></div></form></dialog><script type="module" src="./app.js"></script></body></html>
